<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Stock & Option Advisory Aggregator</title>
  <meta name="description" content="Real-time Indian Stock Market Telegram Advisory Aggregator & NLP Signal Classifier." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       Design Tokens
    ========================================================= */
    :root {
      --bg-base:        #060c18;
      --bg-surface:     #0a1526;
      --bg-card:        rgba(12, 24, 46, 0.85);
      --bg-card-hover:  rgba(18, 34, 62, 0.95);
      --border:         rgba(56, 100, 180, 0.22);
      --border-glow:    rgba(56, 140, 255, 0.4);

      --accent-blue:    #3b82f6;
      --accent-cyan:    #06b6d4;
      --accent-green:   #10b981;
      --accent-red:     #ef4444;
      --accent-orange:  #f59e0b;
      --accent-purple:  #8b5cf6;

      --text-primary:   #f0f4ff;
      --text-secondary: #8ba0c4;
      --text-muted:     #4a6080;

      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;

      --radius-sm:  8px;
      --radius-md:  14px;
      --radius-lg:  20px;

      --shadow-card: 0 4px 32px rgba(0,0,30,0.6), 0 1px 0 rgba(255,255,255,0.04) inset;
      --shadow-glow: 0 0 30px rgba(59,130,246,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient glow background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 50% 50%, rgba(6,182,212,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-surface); }
    ::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.4); border-radius: 99px; }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 64px;
      background: rgba(6, 12, 24, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(59,130,246,0.4);
    }

    .nav-title {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-green);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    .btn-action {
      padding: 8px 16px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.35);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-blue);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(59,130,246,0.28);
      border-color: var(--accent-blue);
      box-shadow: 0 0 16px rgba(59,130,246,0.2);
    }

    .btn-danger {
      background: rgba(239,68,68,0.15) !important;
      border-color: rgba(239,68,68,0.35) !important;
      color: var(--accent-red) !important;
    }

    .btn-danger:hover {
      background: rgba(239,68,68,0.28) !important;
      border-color: var(--accent-red) !important;
      box-shadow: 0 0 16px rgba(239,68,68,0.2) !important;
    }

    /* Main Layout */
    .main-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: calc(100vh - 64px);
    }

    /* Sidebar */
    .sidebar {
      background: rgba(8, 16, 32, 0.6);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 800;
      font-family: var(--font-mono);
    }

    .stat-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .stat-card.option .stat-val { color: var(--accent-blue); }
    .stat-card.btst .stat-val { color: var(--accent-orange); }
    .stat-card.investment .stat-val { color: var(--accent-purple); }
    .stat-card.report .stat-val { color: var(--accent-cyan); }

    /* Live Tester Box */
    .tester-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tester-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .tester-textarea {
      width: 100%;
      height: 80px;
      background: rgba(4, 9, 18, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 10px;
      font-size: 12px;
      font-family: var(--font-sans);
      resize: vertical;
      outline: none;
    }

    .tester-textarea:focus { border-color: var(--accent-blue); }

    /* Content Area */
    .content {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Module Tabs */
    .module-tabs {
      display: flex;
      gap: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 2px;
    }

    .mod-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .mod-tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent-blue);
      background: rgba(59,130,246,0.08);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }

    .mod-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(59,130,246,0.2);
      color: var(--accent-blue);
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-card);
      transition: all 0.25s;
    }

    .card:hover {
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-sym {
      font-size: 18px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--text-primary);
    }

    .tag-category {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .tag-category.OPTION { background: rgba(59,130,246,0.15); color: var(--accent-blue); border: 1px solid rgba(59,130,246,0.3); }
    .tag-category.BTST { background: rgba(245,158,11,0.15); color: var(--accent-orange); border: 1px solid rgba(245,158,11,0.3); }
    .tag-category.INVESTMENT { background: rgba(139,92,246,0.15); color: var(--accent-purple); border: 1px solid rgba(139,92,246,0.3); }
    .tag-category.REPORT { background: rgba(6,182,212,0.15); color: var(--accent-cyan); border: 1px solid rgba(6,182,212,0.3); }

    .btn-delete-card {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-delete-card:hover {
      color: var(--accent-red);
      background: rgba(239,68,68,0.15);
    }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(4, 9, 18, 0.6);
      border-radius: var(--radius-sm);
      padding: 10px;
    }

    .metric-box { text-align: center; }
    .metric-val { font-size: 13px; font-weight: 700; font-family: var(--font-mono); }
    .metric-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

    .raw-box {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      background: rgba(0,0,0,0.25);
      border-left: 3px solid var(--accent-blue);
      padding: 8px 12px;
      border-radius: 4px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">✈️</div>
      <div>
        <div class="nav-title">Telegram Advisory Aggregator</div>
        <div class="nav-subtitle">Real-time Financial Ingestion & Signal Parser Engine</div>
      </div>
    </div>
    <div class="nav-right">
      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>Telegram Engine Active</span>
      </div>
      <button class="btn-action" onclick="fetchData()">Refresh</button>
      <button class="btn-action btn-danger" onclick="clearAllData()">🗑️ Clear All</button>
    </div>
  </nav>

  <!-- Layout -->
  <div class="main-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div>
        <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px;">Overview Stats</div>
        <div class="stats-grid">
          <div class="stat-card option">
            <div class="stat-val" id="stat-option">0</div>
            <div class="stat-lbl">Options</div>
          </div>
          <div class="stat-card btst">
            <div class="stat-val" id="stat-btst">0</div>
            <div class="stat-lbl">BTST</div>
          </div>
          <div class="stat-card investment">
            <div class="stat-val" id="stat-investment">0</div>
            <div class="stat-lbl">Investment</div>
          </div>
          <div class="stat-card report">
            <div class="stat-val" id="stat-report">0</div>
            <div class="stat-lbl">Reports</div>
          </div>
        </div>
      </div>

      <!-- Real-time Test Parser UI -->
      <div class="tester-card">
        <div class="tester-title">🧪 Live Parser Tester</div>
        <textarea id="test-input" class="tester-textarea" placeholder="Paste raw Telegram advisory text here... e.g. BUY NIFTY 24500 CE ENTRY 140-145 SL 120 TGT 165/185"></textarea>
        <button class="btn-action" onclick="runTestParser()" style="width: 100%;">Test Parse Signal</button>
        <pre id="test-output" style="display: none; background: #000; padding: 10px; border-radius: 6px; font-size: 10px; font-family: var(--font-mono); color: #10b981; overflow-x: auto; max-height: 180px;"></pre>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="content">
      
      <!-- Module Filter Tabs -->
      <div class="module-tabs">
        <button class="mod-tab active" onclick="setCategory(null, this)">All Calls <span class="mod-badge" id="badge-all">0</span></button>
        <button class="mod-tab" onclick="setCategory('OPTION', this)">Option Calls <span class="mod-badge" id="badge-option">0</span></button>
        <button class="mod-tab" onclick="setCategory('BTST', this)">BTST Picks <span class="mod-badge" id="badge-btst">0</span></button>
        <button class="mod-tab" onclick="setCategory('INVESTMENT', this)">Investment <span class="mod-badge" id="badge-investment">0</span></button>
        <button class="mod-tab" onclick="setCategory('REPORT', this)">Reports & Research <span class="mod-badge" id="badge-report">0</span></button>
      </div>

      <!-- Recommendations Grid -->
      <div class="cards-grid" id="cards-container">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <script>
    let currentCategory = null;

    async function fetchData() {
      try {
        let url = '/api/recommendations';
        if (currentCategory) url += `?category=${currentCategory}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.success) {
          renderCards(data.recommendations);
          updateStats();
        }
      } catch (err) {
        console.error('Error fetching data:', err);
      }
    }

    async function updateStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        if (data.success && data.stats) {
          const c = data.stats.category_counts;
          document.getElementById('stat-option').innerText = c.OPTION || 0;
          document.getElementById('stat-btst').innerText = c.BTST || 0;
          document.getElementById('stat-investment').innerText = c.INVESTMENT || 0;
          document.getElementById('stat-report').innerText = c.REPORT || 0;

          document.getElementById('badge-all').innerText = data.stats.total_count || 0;
          document.getElementById('badge-option').innerText = c.OPTION || 0;
          document.getElementById('badge-btst').innerText = c.BTST || 0;
          document.getElementById('badge-investment').innerText = c.INVESTMENT || 0;
          document.getElementById('badge-report').innerText = c.REPORT || 0;
        }
      } catch (err) {
        console.error('Error updating stats:', err);
      }
    }

    function setCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.mod-tab').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      fetchData();
    }

    function renderCards(list) {
      const container = document.getElementById('cards-container');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No recommendations found in this category.</div>';
        return;
      }

      container.innerHTML = list.map(item => {
        const entryStr = item.entry_range ? item.entry_range.join(' - ') : 'N/A';
        const targetStr = item.targets ? item.targets.join(', ') : 'N/A';
        const slStr = item.stop_loss ? item.stop_loss : 'N/A';
        const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now';

        return `
          <div class="card">
            <div class="card-header">
              <div>
                <span class="card-sym">${item.symbol}</span>
                ${item.option_type ? `<span style="margin-left: 8px; font-size: 11px; font-weight: 700; color: ${item.option_type === 'CE' ? '#10b981' : '#ef4444'};">${item.strike_price || ''} ${item.option_type}</span>` : ''}
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="tag-category ${item.category}">${item.category}</span>
                <button class="btn-delete-card" onclick="deleteCard(${item.id})" title="Delete signal">🗑️</button>
              </div>
            </div>

            <div class="metrics-row">
              <div class="metric-box">
                <div class="metric-val" style="color: #3b82f6;">${entryStr}</div>
                <div class="metric-lbl">Entry Range</div>
              </div>
              <div class="metric-box">
                <div class="metric-val" style="color: #10b981;">${targetStr}</div>
                <div class="metric-lbl">Targets</div>
              </div>
              <div class="metric-box">
                <div class="metric-val" style="color: #ef4444;">${slStr}</div>
                <div class="metric-lbl">Stop Loss</div>
              </div>
            </div>

            <div class="raw-box">${item.raw_text}</div>

            <div class="card-footer">
              <span>Channel: <strong>${item.source_channel}</strong></span>
              <span>${dateStr}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function runTestParser() {
      const text = document.getElementById('test-input').value;
      if (!text) return;

      const outputEl = document.getElementById('test-output');
      outputEl.style.display = 'block';
      outputEl.innerText = 'Parsing & saving signal...';

      try {
        const res = await fetch('/api/parse', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text: text, source_channel: 'UI_Tester'})
        });
        const data = await res.json();
        outputEl.innerText = JSON.stringify(data.parsed, null, 2);
        fetchData();
      } catch (err) {
        outputEl.innerText = 'Error parsing: ' + err.message;
      }
    }

    async function deleteCard(id) {
      if (!confirm('Delete this recommendation signal?')) return;
      try {
        const res = await fetch(`/api/recommendations/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          fetchData();
        }
      } catch (err) {
        alert('Failed to delete signal: ' + err.message);
      }
    }

    async function clearAllData() {
      if (!confirm('Are you sure you want to clear ALL signals from the database?')) return;
      try {
        const res = await fetch('/api/recommendations/clear', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          fetchData();
        }
      } catch (err) {
        alert('Failed to clear data: ' + err.message);
      }
    }

    // Initial load
    fetchData();
    setInterval(fetchData, 15000);
  </script>
</body>
</html>
